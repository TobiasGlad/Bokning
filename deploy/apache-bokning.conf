# Include inside the existing HTTPS VirtualHost; keep any existing routes.
# Requires proxy, proxy_http, headers and alias modules.
RedirectMatch 301 ^/bokning$ /bokning/
Alias /bokning/static/ /root/bokning/staticfiles/
<Directory /root/bokning/staticfiles>
    Require all granted
    Options -Indexes
</Directory>
# Only configure the alias when Apache can traverse the app directory.
# Prefer copying staticfiles to a dedicated directory readable by Apache;
# do not make /root generally readable.
ProxyPass /bokning/static/ !
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /bokning/ http://127.0.0.1:8010/bokning/ timeout=120
ProxyPassReverse /bokning/ http://127.0.0.1:8010/bokning/
# Never expose /private or /.secrets through an Alias or DocumentRoot.
# Disable query-string logging for this prefix: OAuth callbacks carry codes.
# Use Apache's %U (without %q) rather than %r in the appropriate CustomLog.
