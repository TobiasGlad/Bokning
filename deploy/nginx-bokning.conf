# For the dedicated bokning.norrsinne.se HTTPS virtual host.
# In Plesk, add to Additional nginx directives for the subdomain.
location = / {
    return 302 /bokning/;
}

location = /bokning {
    return 301 /bokning/;
}

location ^~ /bokning/static/ {
    alias /var/www/bokning-static/;
    autoindex off;
}

location ^~ /bokning/ {
    # OAuth callbacks include a temporary code in the query string.
    access_log off;
    client_max_body_size 6m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8010;
}
